name: indo_sakura_assignment
description: A Flutter project for the Indo Sakura assignment.
publish_to: 'none' # Prevent accidental publishing to pub.dev
version: 0.1.0+1
environment:
  sdk: "^3.0.0"
  flutter: "^3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  go_router: ^14.2.0
  firebase_core: ^3.2.0
  firebase_auth: ^5.3.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/static.json
    - assets/images/
